<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart QR Library System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px auto;
            max-width: 760px;
            padding: 24px;
            background: #f4f9ff;
            color: #1a1a1a;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 28px;
            font-size: 1.2rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 14px 18px;
            align-items: center;
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        label {
            font-weight: 600;
        }

        input {
            padding: 10px 12px;
            border: 1px solid #cfe1ff;
            border-radius: 8px;
            font-size: 1rem;
        }

        .button-row {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            background: #2b6eea;
            color: white;
            transition: opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        button:nth-child(2) {
            background: #0c8b5c;
        }

        .status {
            margin-top: 22px;
            min-height: 22px;
            font-weight: 600;
            text-align: center;
        }

        .status.error {
            color: #b42318;
        }

        .status.success {
            color: #117a45;
        }

        .qr-panel {
            margin-top: 28px;
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            display: none;
            text-align: center;
        }

        .qr-panel.visible {
            display: block;
        }

        .qr-panel img {
            max-width: 220px;
            border: 1px solid #dfeafe;
            border-radius: 12px;
            padding: 8px;
            background: white;
        }

        .records {
            margin-top: 24px;
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .records h3 {
            margin-top: 0;
        }

        ul {
            padding-left: 18px;
            margin: 0;
        }

        li {
            margin-bottom: 8px;
        }
    </style>
</head>

<body>
    <h1>Smart QR Library System</h1>
    <h2>ST.JOHNS COLLEGE OF ENGINEERING AND TECHNOLOGY</h2>

    <div class="form-grid">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" placeholder="Enter student name">

        <label for="rollNumber">Roll Number:</label>
        <input type="text" id="rollNumber" placeholder="Enter roll number">

        <label for="bookId">Book ID:</label>
        <input type="text" id="bookId" placeholder="Enter book ID">

        <label for="bookName">Book Name:</label>
        <input type="text" id="bookName" placeholder="Enter book name">

        <div class="button-row">
            <button onclick="issueBook()">Issue Book</button>
            <button onclick="returnBook()">Return Book</button>
        </div>
    </div>

    <div id="statusMessage" class="status" aria-live="polite"></div>

    <div id="qrPanel" class="qr-panel">
        <h3>Issued Book QR</h3>
        <img id="qrImage" alt="Book QR Code" />
    </div>

    <div class="records">
        <h3>Issued Books</h3>
        <ul id="issuedBooksList">
            <li>No books issued yet.</li>
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
